name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Restore, test, and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LedCube.CrossPlatform.sln

      - name: Test
        run: dotnet test LedCube.CrossPlatform.sln -c Release --no-restore

      - name: Build
        run: dotnet build LedCube.CrossPlatform.sln -c Release --no-restore
